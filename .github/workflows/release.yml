name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Build backend (linux)
        run: |
          cd backend
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" \
            -o ../release/cakeduel-server-linux ./cmd/server

      - name: Build backend (windows)
        run: |
          cd backend
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" \
            -o ../release/cakeduel-server.exe ./cmd/server

      - name: Build frontend
        run: |
          cd app
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Assemble packages
        run: |
          set -e
          mkdir -p release/linux-full release/win-full

          # 前端静态文件
          cp -r app/dist release/frontend

          # Linux 完整包: 服务端 + 前端
          cp release/cakeduel-server-linux release/linux-full/
          cp -r release/frontend/. release/linux-full/

          # Windows 完整包: 服务端 + 前端
          cp release/cakeduel-server.exe release/win-full/
          cp -r release/frontend/. release/win-full/

          # 压缩
          (cd release/frontend && zip -qr ../cakeduel-frontend.zip .)
          (cd release/linux-full && zip -qr ../cakeduel-server-linux-full.zip .)
          (cd release/win-full && zip -qr ../cakeduel-server-win-full.zip .)

          ls -lh release

      - name: Write release notes
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="${GITHUB_SHA::7}"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          PREV_TAG=$(git tag --sort=-version:refname | sed -n "2p" || true)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --oneline --no-merges "$PREV_TAG"..HEAD)
          else
            CHANGES=$(git log --oneline --no-merges -20)
          fi

          cat > release/notes.md <<EOF
          ## 蛋糕对决 v${VERSION}

          > 游戏与玩法来自 **I_Nori** 的原版「蛋糕对决」([BV1h8uq6SECj](https://www.bilibili.com/video/BV1h8uq6SECj))

          **构建信息**

          - 版本: \`v${VERSION}\`
          - 提交: \`${SHA}\`
          - 构建时间: ${DATE}
          - Go: 1.26 (CGO_ENABLED=0) · Node: 22 · pnpm: 9

          ### 下载包说明

          | 包 | 内容 | 适用场景 |
          | --- | --- | --- |
          | \`cakeduel-server-linux\` | Linux amd64 服务端(不含前端) | 已有前端静态文件/反向代理时 |
          | \`cakeduel-server.exe\` | Windows amd64 服务端(不含前端) | 已有前端静态文件/反向代理时 |
          | \`cakeduel-frontend.zip\` | 前端静态文件(dist) | 自行部署到 Nginx/静态服务器 |
          | \`cakeduel-server-linux-full.zip\` | Linux 服务端 + 前端静态文件 | Linux 开箱即用, 解压即运行 |
          | \`cakeduel-server-win-full.zip\` | Windows 服务端 + 前端静态文件 | Windows 开箱即用, 解压即运行 |

          ### 使用方式

          - **完整包**: 解压后运行 \`cakeduel-server-linux\` 或 \`cakeduel-server.exe\`, 浏览器访问 \`http://localhost:8080\`
          - **服务端 + 前端分开**: 服务端默认托管 \`../app/dist\`; 也可修改 \`configs/config.yaml\` 的 \`gateway.static-path\` 指向你的前端目录
          - 配置说明见 \`configs/config.yaml\`(端口 / 回合超时 / 断线重连 / Redis)

          ### 更新日志

          \`\`\`
          ${CHANGES}
          \`\`\`
          EOF

          cat release/notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/cakeduel-server-linux
            release/cakeduel-server.exe
            release/cakeduel-frontend.zip
            release/cakeduel-server-linux-full.zip
            release/cakeduel-server-win-full.zip
          body_path: release/notes.md
          draft: false
          prerelease: false
